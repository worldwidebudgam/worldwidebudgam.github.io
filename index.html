<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldwide Computers – Samsung Mobiles, Budgam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#0a2a5c;--mut:#4a5568;--blue:#0b6bd6;--line:#dbe3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#e8eefb;--mut:#a3b0c7;--blue:#4da3ff;--line:#24324d}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--ink:#e8eefb;--mut:#a3b0c7;--blue:#4da3ff;--line:#24324d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
html[lang=ur] body{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",Tahoma,"Segoe UI",serif;line-height:2.1}
html[lang=ur] h1{line-height:1.9}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px}
header img{height:64px;width:auto;background:#fff;border-radius:8px}
.hr{display:flex;align-items:center;gap:6px}
nav a{color:var(--ink);text-decoration:none;margin-inline-start:18px;font-weight:600}
nav a:hover,a:focus-visible{color:var(--blue)}
#lt{margin-inline-start:18px;background:var(--blue);color:#fff;border:0;border-radius:99px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer}
.hero{padding:44px 0 28px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
h1{font-size:clamp(28px,5vw,46px);line-height:1.12;margin:0 0 14px;letter-spacing:-.02em}
.hero p{color:var(--mut);max-width:46ch;margin:0 0 20px}
.btn{display:inline-block;background:var(--blue);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;text-decoration:none;margin:0 0 10px;margin-inline-end:10px;border:2px solid var(--blue)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.hlogo{display:block;height:96px;width:auto;max-width:100%;background:#fff;border-radius:12px;margin-bottom:14px}
.hero-art{display:flex;justify-content:center;gap:10px;align-items:center}.hero-art img{width:32%;max-width:200px;height:auto;background:#fff;border-radius:14px;padding:6px;border:1px solid var(--line)}.card .pic{background:#fff}.pic img{max-width:100%;max-height:100%;object-fit:contain}
.ad{background:linear-gradient(100deg,#0a2a5c,#0b6bd6);color:#fff;border-radius:14px;padding:18px 22px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ad b{font-size:20px}
section{padding:34px 0}h2{font-size:28px;margin:0 0 6px}.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.gallery-grid img{display:block;width:100%;height:240px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--card)}@media(max-width:760px){.gallery-grid img{height:190px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.card .pic{background:linear-gradient(160deg,var(--bg),var(--line));border-radius:10px;height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.card h3{margin:0;font-size:18px}.card small{color:var(--mut)}
.price{font-size:22px;font-weight:800;color:var(--blue);margin:8px 0 2px}
.tag{align-self:flex-start;background:#e6f1ff;color:#0a4aa0;font-size:12px;font-weight:700;padding:0 10px;border-radius:99px;margin-bottom:6px}
.card a{margin-top:auto;padding-top:10px;color:var(--blue);font-weight:700;text-decoration:none}
.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ads div{border-radius:14px;padding:22px;color:#fff;min-height:130px}
.ads div:nth-child(1){background:#0b6bd6}.ads div:nth-child(2){background:#0a2a5c}.ads div:nth-child(3){background:#3a3a3a}
.ads h3{margin:0 0 6px}.note{font-size:13px;color:var(--mut);margin-top:14px}
.contact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.mapbox{display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;min-height:200px}
footer{padding:24px 0 36px;color:var(--mut);text-align:center;font-size:14px}
.flogo{display:block;height:72px;width:auto;background:#fff;border-radius:10px;margin:0 auto 10px}
.bar{display:none;position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);gap:10px;z-index:20}
.bar a{flex:1;text-align:center;background:var(--blue);color:#fff;font-weight:700;padding:8px;border-radius:10px;text-decoration:none}.bar a+a{background:#1ea952}
#fab{position:fixed;right:16px;bottom:20px;z-index:30;background:#0a2a5c;color:#fff;border:2px solid #fff;border-radius:99px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#fab{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 8px}#fab svg{border-radius:50%;background:#fff}.r{display:flex;gap:6px;align-items:flex-end;align-self:flex-start;max-width:94%}.r svg{flex:none;border-radius:50%}.r .m{align-self:auto;max-width:none}#chat .top{align-items:center}#ctt{display:flex;gap:10px;align-items:center;line-height:1.3}#ctt svg{border-radius:50%;background:#fff}#ctt small{font-weight:400;opacity:.85}#chat{display:none;position:fixed;right:12px;bottom:78px;z-index:31;width:min(370px,calc(100vw - 24px));height:min(480px,calc(100vh - 140px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);flex-direction:column;overflow:hidden}
#chat.open{display:flex}
#chat .top{background:#0a2a5c;color:#fff;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between}
#chat .top button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:4px 12px;border-radius:12px;font-size:15px;line-height:1.7}
.m.b{background:var(--bg);align-self:flex-start;border:1px solid var(--line)}.m.u{background:var(--blue);color:#fff;align-self:flex-end}
.m .buy{display:inline-block;background:#1ea952;color:#fff;padding:4px 14px;border-radius:8px;text-decoration:none;font-weight:700;margin:6px 6px 0 0}.m .buy.alt{background:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.chips button{background:var(--card);color:var(--blue);border:1.5px solid var(--blue);border-radius:99px;padding:2px 12px;font:inherit;font-size:14px;cursor:pointer}
#chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#inp{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;background:var(--bg);color:var(--ink)}
#chat form button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
@media(max-width:760px){.hero .wrap,.contact{grid-template-columns:1fr}header .wrap{flex-direction:column;gap:6px;padding:10px 16px}header img{height:72px}.hr{width:100%;justify-content:center;flex-wrap:wrap}nav a{margin:0;margin-inline-end:6px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px}#lt{margin:0}.hero{padding-top:22px}.hlogo{display:none}.bar{display:flex}body{padding-bottom:70px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:12px}.card .pic{height:150px}.price{font-size:19px}#fab{bottom:76px}#chat{bottom:130px;height:min(440px,calc(100vh - 190px))}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body>

k_series:'Samsung Galaxy range: the S series (S26 Ultra, S26, S26 FE) is the premium flagship line with the best cameras and performance. Z Fold and Z Flip are foldable phones. The A series is mid-range with great value, and the M and F series are budget to mid-range phones, popular for big batteries. Tell me your budget and I will suggest the right one. For today’s price of any model, message us on WhatsApp.',
k_fold:'Galaxy Z Fold opens like a small tablet, great for work, videos and multitasking. Galaxy Z Flip folds into a compact square and is built for style and easy carrying. Both are premium phones. Message us on WhatsApp for current prices and offers.',
k_budget:'On a lower budget, the Samsung A series gives a good screen, reliable cameras and long software support, while the M and F series focus on big batteries and low prices. The lowest-priced phone on our list is the Galaxy S26 FE at ₹79,999. For A, M and F series, message us on WhatsApp for today’s rates.',
k_apple:'Samsung vs Apple iPhone: iPhones run iOS, feel smooth and simple, have strong video and long software support, but cost more and are less customizable. Samsung Galaxy runs Android with One UI and offers more choice at every price, plus the S Pen on Ultra, foldables, fast charging and customization. For choice and value Samsung is usually better; if you love Apple’s ecosystem, iPhone suits you. We sell Samsung only.',
k_xiaomi:'Samsung vs Xiaomi, Redmi and Poco: these brands usually give very high specs and fast charging for the price. Samsung usually leads in display quality, camera consistency, software updates, service network and resale value, so it is a safer long-term buy.',
k_vivo:'Samsung vs Vivo and Oppo: Vivo and Oppo focus on slim design, selfie cameras and fast charging. Samsung usually offers better displays, longer software updates, a wider service network in India and good resale value.',
k_oneplus:'Samsung vs OnePlus: OnePlus is known for smooth performance and very fast charging. Samsung usually offers better cameras in its flagships, a wider range including foldables and the S Pen, and a larger service network.',
k_realme:'Samsung vs Realme: Realme gives strong specs for the price in budget phones. Samsung usually costs a little more but offers better build, display, long-term software updates and service support.',
k_pixel:'Samsung vs Google Pixel: Pixel is loved for clean Android and AI photo features, but it has limited availability and a smaller service network in India. Samsung Galaxy offers more variety, bright displays and easy service across the country.',
k_brands:'Brand comparison: Apple iPhone is best for the iOS ecosystem and video; Xiaomi, Realme and Poco for specs per rupee; Vivo and Oppo for selfies and design; OnePlus for performance and charging; Google Pixel for clean software and AI photos. Samsung balances everything: great displays, strong cameras, long software support, a wide service network and a model at every price. Tell me which brand you are considering and I will compare it with Samsung.',
